<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Это увидят в выдаче (заголовок вкладки и строка в поиске) -->
    <title>Егор — обо мне и моих проектах</title>
    
    <!-- Краткое описание, которое часто показывают под ссылкой в поиске -->
    <meta name="description" content="Первый сайт Егора: рассказываю о себе, своих увлечениях и первых шагах в создании сайтов.">
    
    <!-- Чтобы поисковики точно знали, что страница для людей, а не для спама -->
    <meta name="robots" content="index, follow">

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background-color: #f9f9f9;
        color: #333;
      }
      .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h1 {
        color: #2c3e50;
      }
      img {
        max-width: 100%;
        border-radius: 8px;
        display: block;
        margin: 20px 0;
      }
      a {
        color: #3498db;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Привет, я Егор</h1>
      <p>Это мой первый сайт. Увлекаюсь созданием сайтов.</p>

      <section>
        <h2>Мои достижения</h2>
        <p>Создание первого сайта.</p>
      </section>

      <!-- Блок контактов помогает и людям, и поисковикам понять, что это личный сайт -->
      <section>
        <h2>Где меня найти</h2>
        <p>
          Telegram: <a href="https://t.me/Zhyk_95">Zhychara</a><br>
        </p>
      </section>
    </div>
  </body>
</html>
