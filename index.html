<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Продуктивный день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --paper: #ffffff;
    --ink: #1a2230;
    --muted: #5d6879;
    --line: #d5dbe4;
    --sun: #f0b429;
    --sun-soft: #fdf1cf;
    --deep: #1d5f6b;
    --deep-soft: #dcecee;
    --danger: #b3382c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171f;
      --paper: #1b222d;
      --ink: #eceff4;
      --muted: #9aa5b6;
      --line: #2c3544;
      --sun: #f0b429;
      --sun-soft: #3a3118;
      --deep: #6cc0cc;
      --deep-soft: #1d3a40;
      --danger: #ee8174;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  h1, h2 { font-family: "Unbounded", "Onest", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }

  /* Шапка */
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; font-weight: 700; }
  .date { color: var(--muted); font-size: 1.05rem; text-transform: capitalize; }
  .greeting { margin: 6px 0 0; color: var(--muted); }

  /* Лента дня — главный элемент */
  .day {
    margin: 28px 0 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px 18px;
  }
  .day-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .95rem; color: var(--muted); }
  .day-head strong { color: var(--ink); font-weight: 600; }
  .strip { position: relative; display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; margin: 14px 0 8px; }
  .strip i { height: 34px; border-radius: 5px; background: var(--deep-soft); }
  .strip i.past { background: var(--deep); }
  .strip i.now { background: var(--sun); }
  .ticks { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }

  /* Сетка */
  .grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 24px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .card h2 { font-size: 1.15rem; font-weight: 500; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .count { color: var(--muted); font-size: .9rem; }

  /* Задачи */
  .add { display: flex; gap: 8px; margin-bottom: 14px; }
  .add input { flex: 1; min-width: 0; padding: 11px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; background: var(--deep); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn { color: #0d1318; } }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.08); }
  .bar { height: 8px; border-radius: 99px; background: var(--deep-soft); overflow: hidden; margin-bottom: 14px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--sun); transition: width .3s; }

  ul { list-style: none; margin: 0; padding: 0; }
  .task { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--deep); flex: none; }
  .task label { flex: 1; word-break: break-word; cursor: pointer; }
  .task.done label { color: var(--muted); text-decoration: line-through; }
  .icon { border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 8px; font-size: 1.05rem; line-height: 1; }
  .icon:hover { color: var(--danger); background: var(--bg); }
  .empty { color: var(--muted); padding: 8px 0; }

  /* Таймер */
  .timer { text-align: center; }
  .time { font-family: "Unbounded", sans-serif; font-size: clamp(2.6rem, 8vw, 3.6rem); font-weight: 500; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
  .modes { display: inline-flex; gap: 6px; margin-bottom: 8px; }
  .modes button { border: 1px solid var(--line); background: transparent; padding: 6px 14px; border-radius: 99px; }
  .modes button[aria-pressed=true] { background: var(--sun-soft); border-color: var(--sun); font-weight: 600; }
  .timer .actions { display: flex; justify-content: center; gap: 8px; }

  /* Заметки */
  .tools { display: flex; gap: 8px; margin-bottom: 14px; }
  .tools input { flex: 1; min-width: 0; padding: 11px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .notes { display: grid; gap: 12px; }
  .note { background: var(--sun-soft); border: 1px solid transparent; border-radius: 12px; padding: 12px 14px 10px; }
  .note input.title { width: 100%; border: 0; background: transparent; font-weight: 600; padding: 2px 0 4px; }
  .note textarea { width: 100%; min-height: 90px; border: 0; background: transparent; resize: vertical; padding: 2px 0; line-height: 1.5; }
  .note input:focus-visible, .note textarea:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; border-radius: 4px; }
  .note footer { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .8rem; margin-top: 4px; }
  @media (prefers-color-scheme: dark) { .note { background: #29303c; } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="date" id="date"></div>
      <h1>Продуктивный день</h1>
      <p class="greeting" id="greeting"></p>
    </div>
  </header>

  <section class="day" aria-label="Ход дня">
    <div class="day-head">
      <span>Сейчас <strong id="clock">--:--</strong></span>
      <span id="dayLeft"></span>
    </div>
    <div class="strip" id="strip" role="img" aria-label="Шкала дня с 6:00 до 24:00"></div>
    <div class="ticks"><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
  </section>

  <main class="grid">
    <div class="col">
      <section class="card" aria-labelledby="tasksTitle">
        <div class="card-head">
          <h2 id="tasksTitle">Задачи на сегодня</h2>
          <span class="count" id="taskCount"></span>
        </div>
        <div class="bar" aria-hidden="true"><span id="progress"></span></div>
        <form class="add" id="taskForm">
          <input id="taskInput" type="text" placeholder="Что нужно сделать?" aria-label="Новая задача" maxlength="140" autocomplete="off">
          <button class="btn" type="submit">Добавить</button>
        </form>
        <ul id="taskList"></ul>
        <button class="btn ghost" id="clearDone" type="button" style="margin-top:12px">Убрать выполненные</button>
      </section>

      <section class="card timer" aria-labelledby="timerTitle">
        <div class="card-head"><h2 id="timerTitle">Фокус-таймер</h2></div>
        <div class="modes" role="group" aria-label="Режим таймера">
          <button type="button" data-min="25" aria-pressed="true">Работа 25</button>
          <button type="button" data-min="5" aria-pressed="false">Перерыв 5</button>
          <button type="button" data-min="15" aria-pressed="false">Отдых 15</button>
        </div>
        <div class="time" id="time" role="timer" aria-live="off">25:00</div>
        <div class="actions">
          <button class="btn" id="startBtn" type="button">Старт</button>
          <button class="btn ghost" id="resetBtn" type="button">Сбросить</button>
        </div>
      </section>
    </div>

    <section class="card" aria-labelledby="notesTitle">
      <div class="card-head">
        <h2 id="notesTitle">Заметки</h2>
        <span class="count" id="noteCount"></span>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="Поиск по заметкам" aria-label="Поиск по заметкам">
        <button class="btn" id="newNote" type="button">Новая заметка</button>
      </div>
      <div class="notes" id="notes"></div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  // ---------- Хранилище ----------
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function $(id) { return document.getElementById(id); }

  var tasks = load('pd_tasks', []);
  var notes = load('pd_notes', []);

  // ---------- Шапка и лента дня ----------
  var START = 6, END = 24;

  function renderHeader() {
    var now = new Date();
    $('date').textContent = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    var h = now.getHours();
    $('greeting').textContent = h < 5 ? 'Пора отдыхать.' : h < 12 ? 'Доброе утро. С чего начнём?' : h < 18 ? 'Добрый день. Что на очереди?' : 'Добрый вечер. Подведите итоги дня.';
    $('clock').textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    var cur = h + now.getMinutes() / 60;
    var left = Math.max(0, END - Math.max(cur, START));
    var lh = Math.floor(left), lm = Math.round((left - lh) * 60);
    $('dayLeft').innerHTML = cur >= END ? 'День закончился' : 'До конца дня <strong>' + lh + ' ч ' + lm + ' мин</strong>';

    var strip = $('strip');
    if (!strip.children.length) {
      for (var i = 0; i < END - START; i++) strip.appendChild(document.createElement('i'));
    }
    for (var j = 0; j < strip.children.length; j++) {
      var hour = START + j;
      strip.children[j].className = hour + 1 <= cur ? 'past' : (hour <= cur && cur < hour + 1 ? 'now' : '');
    }
  }

  // ---------- Задачи ----------
  function renderTasks() {
    var list = $('taskList');
    list.innerHTML = '';
    if (!tasks.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Пока пусто. Запишите первую задачу.';
      list.appendChild(li);
    }
    tasks.forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 't' + t.id; cb.checked = t.done;
      cb.addEventListener('change', function () { t.done = cb.checked; save('pd_tasks', tasks); renderTasks(); });
      var lb = document.createElement('label');
      lb.htmlFor = cb.id; lb.textContent = t.text;
      var del = document.createElement('button');
      del.className = 'icon'; del.type = 'button'; del.textContent = '✕';
      del.setAttribute('aria-label', 'Удалить задачу');
      del.addEventListener('click', function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        save('pd_tasks', tasks); renderTasks();
      });
      li.appendChild(cb); li.appendChild(lb); li.appendChild(del);
      list.appendChild(li);
    });
    var done = tasks.filter(function (t) { return t.done; }).length;
    $('taskCount').textContent = tasks.length ? 'Выполнено ' + done + ' из ' + tasks.length : '';
    $('progress').style.width = tasks.length ? (done / tasks.length * 100) + '%' : '0';
  }

  $('taskForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = $('taskInput').value.trim();
    if (!text) return;
    tasks.push({ id: uid(), text: text, done: false });
    $('taskInput').value = '';
    save('pd_tasks', tasks); renderTasks();
  });
  $('clearDone').addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save('pd_tasks', tasks); renderTasks();
  });

  // ---------- Таймер ----------
  var total = 25 * 60, remaining = total, tick = null;
  function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function drawTime() { $('time').textContent = fmt(remaining); document.title = (tick ? fmt(remaining) + ' · ' : '') + 'Продуктивный день'; }
  function stopTimer() { clearInterval(tick); tick = null; $('startBtn').textContent = 'Старт'; }
  function setMode(min) {
    stopTimer(); total = min * 60; remaining = total; drawTime();
    document.querySelectorAll('.modes button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.min === min)); });
  }
  document.querySelectorAll('.modes button').forEach(function (b) {
    b.addEventListener('click', function () { setMode(+b.dataset.min); });
  });
  $('startBtn').addEventListener('click', function () {
    if (tick) { stopTimer(); return; }
    $('startBtn').textContent = 'Пауза';
    var end = Date.now() + remaining * 1000;
    tick = setInterval(function () {
      remaining = Math.max(0, Math.round((end - Date.now()) / 1000));
      drawTime();
      if (remaining === 0) { stopTimer(); drawTime(); alert('Время вышло!'); }
    }, 250);
  });
  $('resetBtn').addEventListener('click', function () { stopTimer(); remaining = total; drawTime(); });

  // ---------- Заметки ----------
  function stamp(ts) {
    return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function renderNotes() {
    var q = $('search').value.trim().toLowerCase();
    var box = $('notes');
    box.innerHTML = '';
    var shown = notes.filter(function (n) {
      return !q || (n.title + ' ' + n.text).toLowerCase().indexOf(q) !== -1;
    });
    $('noteCount').textContent = notes.length ? 'Всего: ' + notes.length : '';
    if (!shown.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = notes.length ? 'Ничего не найдено.' : 'Заметок пока нет. Нажмите «Новая заметка».';
      box.appendChild(p);
      return;
    }
    shown.forEach(function (n) {
      var el = document.createElement('article');
      el.className = 'note';
      var title = document.createElement('input');
      title.className = 'title'; title.type = 'text'; title.placeholder = 'Заголовок';
      title.setAttribute('aria-label', 'Заголовок заметки'); title.value = n.title;
      var text = document.createElement('textarea');
      text.placeholder = 'Текст заметки'; text.setAttribute('aria-label', 'Текст заметки'); text.value = n.text;
      var foot = document.createElement('footer');
      var when = document.createElement('span'); when.textContent = 'Изменено ' + stamp(n.updated);
      var del = document.createElement('button');
      del.className = 'icon'; del.type = 'button'; del.textContent = 'Удалить';
      del.style.fontSize = '.85rem';
      del.addEventListener('click', function () {
        notes = notes.filter(function (x) { return x.id !== n.id; });
        save('pd_notes', notes); renderNotes();
      });
      function onEdit() {
        n.title = title.value; n.text = text.value; n.updated = Date.now();
        when.textContent = 'Изменено ' + stamp(n.updated);
        save('pd_notes', notes);
      }
      title.addEventListener('input', onEdit);
      text.addEventListener('input', onEdit);
      foot.appendChild(when); foot.appendChild(del);
      el.appendChild(title); el.appendChild(text); el.appendChild(foot);
      box.appendChild(el);
    });
  }
  $('newNote').addEventListener('click', function () {
    $('search').value = '';
    notes.unshift({ id: uid(), title: '', text: '', updated: Date.now() });
    save('pd_notes', notes); renderNotes();
    var first = document.querySelector('.note input.title');
    if (first) first.focus();
  });
  $('search').addEventListener('input', renderNotes);

  // ---------- Старт ----------
  renderHeader(); renderTasks(); renderNotes(); drawTime();
  setInterval(renderHeader, 30000);
})();
</script>
</body>
</html>
